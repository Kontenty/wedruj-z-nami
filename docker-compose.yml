services:
  mariadb:
    image: mariadb:${MARIADB_VERSION:-10.6.16}
    container_name: mariadb-wedruj-z-nami
    ports:
      - "${HOST_PORT:-3306}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_DATABASE:-wedruj_z_nami}
      MARIADB_USER: ${DB_USER:-user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-user}
      MARIADB_ROOT_HOST: ${DB_ROOT_HOST:-%}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ${BACKUP_DIR:-./backup}:/backup
    restart: ${RESTART_POLICY:-unless-stopped}
    networks:
      - mariadb_network

volumes:
  mariadb_data:
    name: ${VOLUME_NAME:-mariadb_data_wedruj_z_nami}

networks:
  mariadb_network:
    name: ${NETWORK_NAME:-mariadb_network_wedruj_z_nami}
