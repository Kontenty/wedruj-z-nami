pre-commit:
  parallel: true
  jobs:
    - run: npx eslint --fix '{staged_files}'
      glob:
        - '*.ts'
        - '*.js'
        - '*.tsx'
        - '*.jsx'
        - '*.svelte'
      stage_fixed: true
    - run: |
        for file in {staged_files}; do
          php -l "$file" || exit 1
        done
      glob: '*.php'
    - run: vendor/bin/pint --dirty
      glob: '*.php'
      stage_fixed: true
    - run: npx prettier --write '{staged_files}'
      glob:
        - '*.ts'
        - '*.js'
        - '*.tsx'
        - '*.jsx'
        - '*.svelte'
        - '*.css'
        - '*.json'
        - '*.md'
        - '*.yml'
        - '*.yaml'
      stage_fixed: true
